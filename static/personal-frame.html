<style id="darkreader-grid-colours" class="darkreader">
html[data-darkreader-scheme="dark"] body::before {
  background: #61989a !important;
  mix-blend-mode: normal !important;
}

html[data-darkreader-scheme="dark"] body::after {
  background: #b45e69 !important;
  mix-blend-mode: normal !important;
}

html[data-darkreader-scheme="dark"]::after {
  background: #56454f !important;
  mix-blend-mode: normal !important;
}

html[data-darkreader-scheme="dark"] .personal-name { border-bottom-color: #61989a !important; }
html[data-darkreader-scheme="dark"] .mobile-nav { border-bottom-color: #b45e69 !important; }
</style>
<script>
  const gridColours = document.getElementById("darkreader-grid-colours");
  new MutationObserver(() => requestAnimationFrame(() => document.head.append(gridColours)))
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-darkreader-scheme"] });

  window.addEventListener("load", () => {
    if (document.body.classList.contains("bookshelf") || navigator.connection?.saveData) return;

    const illustration = new Image();
    illustration.fetchPriority = "low";
    illustration.src = "/static/imgs/ezechiele-eating.webp";
  }, { once: true });

  const mobileLayout = matchMedia("(max-width: 48rem), (max-height: 32rem) and (pointer: coarse)");

  function placePageFigure(figure) {
    const content = document.getElementById("quarto-document-content");
    const contact = document.querySelector(".personal-links");

    function updatePlacement() {
      if (mobileLayout.matches) content.append(figure);
      else contact.before(figure);
    }

    updatePlacement();
    mobileLayout.addEventListener("change", updatePlacement);
  }
</script>
